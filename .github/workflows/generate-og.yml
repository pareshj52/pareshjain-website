name: Generate editorial OG artwork
on:
  push:
    branches:
      - 'redesign/awwwards-art-direction-2026-11-13'
    paths:
      - 'scripts/generate_og.py'
      - '.github/workflows/generate-og.yml'
jobs:
  artwork:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Pillow
        run: python -m pip install pillow==11.3.0
      - name: Render social artwork
        run: python scripts/generate_og.py
      - name: Commit artwork to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          if ! git diff --cached --quiet; then
            git commit -m "Render branded OG artwork for editorial redesign"
            git push
          fi
