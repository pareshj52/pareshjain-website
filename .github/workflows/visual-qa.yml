name: Visual & Interaction QA
on:
  push:
    branches: ['redesign/awwwards-art-direction-2026-11-13']
    paths:
      - qa/visual_audit.py
      - index.html
      - .github/workflows/visual-qa.yml
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install browser testing dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real Chromium visual QA
        run: python qa/visual_audit.py
      - name: Commit review screenshots to isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Capture verified desktop and mobile review screenshots"
            git push
          fi
